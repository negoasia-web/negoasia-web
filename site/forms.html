<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Form definitions — NegoAsia</title>
</head>
<body>
<!-- Netlify detects forms by parsing deployed HTML at build time. The review
     widget is injected by JavaScript, so its form would never be detected.
     This page exists only to declare it. Nothing links here, it is noindex,
     and it is never shown to a visitor. Do not delete it: without it the
     review button silently posts into the void. -->
<!-- enctype + input file : Netlify n'accepte un fichier que si le formulaire
     DÉCLARÉ ici le prévoit. Un champ ajouté seulement côté JS serait ignoré au
     build, et l'image partirait dans le vide comme les envois de juillet. -->
<form name="review" data-netlify="true" netlify-honeypot="bot-field"
      enctype="multipart/form-data" hidden>
  <input type="hidden" name="form-name" value="review">
  <input name="bot-field">
  <input name="page">
  <input name="where">
  <input name="selector">
  <input name="excerpt">
  <textarea name="message"></textarea>
  <input name="author">
  <input name="viewport">
  <input name="useragent">
  <!-- batch : identifiant du lot d'envoi (29/08). Le widget n'envoie plus
       remarque par remarque au fil de l'eau, il envoie une liste ; ce champ
       permet de regrouper les envois d'un même lot dans le rapport. -->
  <input name="batch">
  <input name="image" type="file">
</form>
</body>
</html>
